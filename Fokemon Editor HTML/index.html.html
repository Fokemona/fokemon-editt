<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor Simple HTML+JS</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bd:#30363d;--fg:#e6edf3;--fg2:#8b949e;--acc:#58a6ff;--ok:#3fb950;--err:#f85149}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Fira Code',monospace;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;font-size:14px;line-height:1.6}
header{background:var(--bg2);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.2rem;font-weight:600;background:linear-gradient(90deg,var(--acc),#a371f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--fg2);background:var(--bg);border:1px solid var(--bd);transition:all .15s}
.tab:hover{color:var(--fg);border-color:var(--acc)}
.tab.active{color:var(--fg);background:var(--bg2);border-color:var(--acc)}
.btn{padding:6px 12px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:all .15s}
.btn-pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.btn-pri:hover{filter:brightness(1.1)}
.btn-sec{background:var(--bg2);color:var(--fg);border-color:var(--bd)}
.btn-sec:hover{background:var(--bg);border-color:var(--acc)}
.main{display:flex;flex:1;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column;background:var(--bg2);min-width:300px}
.panel-hdr{padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd);font-size:12px;font-weight:600;color:var(--fg2);display:flex;justify-content:space-between;align-items:center}
.editor{flex:1;border:none;outline:none;resize:none;background:transparent;color:var(--fg);font-family:'Fira Code',monospace;font-size:14px;line-height:1.6;padding:12px;tab-size:4}
.editor::placeholder{color:var(--fg2);opacity:.5}
.splitter{width:4px;background:var(--bd);cursor:col-resize;transition:background .15s}
.splitter:hover{background:var(--acc)}
.preview{flex:1;background:white;border:none}
.console{height:140px;background:var(--bg);border-top:1px solid var(--bd);display:flex;flex-direction:column}
.console-hdr{padding:6px 12px;font-size:11px;font-weight:600;color:var(--fg2);display:flex;justify-content:space-between}
.console-out{flex:1;overflow-y:auto;padding:8px 12px;font-size:12px;font-family:'Fira Code',monospace}
.cline{display:flex;gap:8px;padding:2px 0;word-break:break-word}
.cline.log{color:var(--fg)}
.cline.err{color:var(--err)}
.cline.warn{color:#d29922}
.ctime{color:var(--fg2);font-size:11px;white-space:nowrap}
@media(max-width:768px){.main{flex-direction:column}.splitter{width:100%;height:4px;cursor:row-resize}.tabs{display:none}}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:var(--fg2)}
</style>
</head>
<body>
<header>
<h1>🎮 Fokemon Edit HTML y JS</h1>
<div class="tabs">
<button class="tab active" data-tab="html">📄 HTML</button>
<button class="tab" data-tab="js">⚡ JavaScript</button>
</div>
<button class="btn btn-pri" onclick="refresh()">🔄 Actualizar (Ctrl+Enter)</button>
<button class="btn btn-sec" onclick="download()">📥 Descargar</button>
</header>

<div class="main">
<div class="panel" id="edPanel">
<div class="panel-hdr"><span id="tabTitle">HTML</span></div>
<textarea class="editor" id="edHTML" spellcheck="false" placeholder="<!DOCTYPE html>&#10;<html>&#10;<head><title>Test</title></head>&#10;<body>&#10;  <h1 id="titulo">Hola</h1>&#10;  <button id="btn">Click</button>&#10;  <div id="out"></div>&#10;</body>&#10;</html>"></textarea>
<textarea class="editor" id="edJS" spellcheck="false" style="display:none" placeholder="// JavaScript aquí&#10;const btn = document.getElementById('btn');&#10;const out = document.getElementById('out');&#10;let n = 0;&#10;btn.onclick = () => {&#10;  n++;&#10;  out.textContent = 'Clicks: ' + n;&#10;  console.log('Click #' + n);&#10;};&#10;console.log('✅ JS cargado');"></textarea>
</div>
<div class="splitter" id="splitter"></div>
<iframe class="preview" id="pv" title="Preview" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-modals allow-downloads"></iframe>
</div>

<div class="console">
<div class="console-hdr"><span>🖥️ Consola</span><button class="btn" style="padding:2px 8px;font-size:11px" onclick="document.getElementById('cOut').innerHTML=''">Limpiar</button></div>
<div class="console-out" id="cOut"></div>
</div>

<script>
// Console capture
const OC={log:console.log,error:console.error,warn:console.warn};
function log(m,t='log'){const d=document.createElement('div');d.className='cline '+t;const tm=new Date().toLocaleTimeString();const ic=t==='err'?'❌':t==='warn'?'⚠️':'📝';d.innerHTML=`<span class="ctime">[${tm}]</span><span>${ic}</span><span>${esc(m)}</span>`;document.getElementById('cOut').appendChild(d);document.getElementById('cOut').scrollTop=9e9;OC[t](m)}
function esc(s){return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>')}
['log','error','warn'].forEach(m=>console[m]=(...a)=>{OC[m].apply(console,a);log(a.map(x=>typeof x==='object'?JSON.stringify(x,null,2):x).join(' '),m)});

// State
const edHTML=document.getElementById('edHTML'), edJS=document.getElementById('edJS'), pv=document.getElementById('pv');
let active='html', last='', timer=null;

// Tabs
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));edHTML.style.display=active==='html'?'block':'none';edJS.style.display=active==='js'?'block':'none';document.getElementById('tabTitle').textContent=active.toUpperCase()});

// Build preview
function build(){let h=edHTML.value;const j=edJS.value;if(h.includes('</body>'))h=h.replace('</body>',`<script>${j}<\/script>\n</body>`);else h+=`<script>${j}<\/script>`;return h.replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/&#10;/g,'\n').replace(/'/g,"'")}

// Refresh
function refresh(){try{const h=build();if(h===last){log('Sin cambios','warn');return}last=h;const u=URL.createObjectURL(new Blob([h],{type:'text/html'}));pv.src=u;pv.onload=()=>setTimeout(()=>URL.revokeObjectURL(u),1000);log('🔄 Refrescado','log')}catch(e){log('Error: '+e.message,'err')}}

// Auto-refresh on input
[edHTML,edJS].forEach(e=>e.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(refresh,300)}));

// Download
function download(){const h=build();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='mi-pagina-'+Date.now()+'.html';a.click()}

// Splitter drag
let drag=false;document.getElementById('splitter').addEventListener('mousedown',e=>{drag=true;e.target.classList.add('dragging')});addEventListener('mousemove',e=>{if(!drag)return;const r=document.getElementById('edPanel').getBoundingClientRect();const w=Math.max(300,Math.min(innerWidth-300,e.clientX-r.left));document.getElementById('edPanel').style.flex=`0 0 ${w}px`});addEventListener('mouseup',()=>{if(drag){document.querySelectorAll('.splitter').forEach(s=>s.classList.remove('dragging'));drag=false}});

// Keys
addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();refresh()}if(e.ctrlKey&&e.shiftKey&&e.key==='S'){e.preventDefault();download()}if(e.key==='F11'){e.preventDefault();pv.requestFullscreen().catch(()=>{})}});

// Init
refresh();
log('🚀 Editor listo - Edita HTML/JS y pulsa Ctrl+Enter','log');
</script>
</body>
</html>
